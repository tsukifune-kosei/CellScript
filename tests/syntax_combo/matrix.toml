# Matrix metadata for the Rust `cellscript-tools syntax-combo-audit` runner.
# The first runner version keeps generation deterministic and small, while this
# file records the axes that must stay covered as the generator grows.

[cross_edition]
# Run every selected Edition 2026 source, including negative oracles and
# regression seeds, unchanged in both editions. Native 2027-only seeds retain
# their declared edition. Mode budgets count source cases before expansion;
# quick remains a bounded smoke test, not a claim of complete edition parity.
editions = ["2026", "2027"]

[mode.quick]
budget = 64
min_cases = 24
min_accept = 14
min_reject = 10
